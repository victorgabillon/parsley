name: ci

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches: [master]

jobs:


  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest]
        python-version: [ '3.14' ]

    steps:

      - uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          pip install tox==4.67.2
      - name: Test with tox
        run: tox

