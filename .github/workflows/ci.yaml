name: ci

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches: [master]

jobs:


  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest]
        python-version: [ '3.14' ]

    steps:

      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.56.1
      - name: Test with tox
        run: tox

