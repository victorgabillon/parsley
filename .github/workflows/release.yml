name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip

      - run: python -m pip install -U pip==26.2.2 tox==4.67.2
      - run: tox -q

  publish:
    needs: [quality]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Build
        run: |
          python -m pip install -U pip==26.2.2 build==1.6.1
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
