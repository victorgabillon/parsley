[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parsley-coco"
version = "0.2.0"
description = "A parser combining dacite and argparse"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

readme = { file = "README.md", content-type = "text/markdown" }

authors = [
  { name = "Victor Gabillon", email = "victorgabillon@gmail.com" }
]
requires-python = ">=3.14"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.14"]
dependencies = [
  "PyYAML>=6.0.3",
  "dacite>=1.9.2",
  "click>=8.5.0",
  "rich>=15.0.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage==7.17.0",
  "types-PyYAML==6.0.12.20260906",
]

lint = [
  "ruff==0.17.3",
  "pylint==4.1.3",
]

typecheck = [
  "mypy==2.4.0",
  "pyright[nodejs]==1.1.414",
]

dev = [
  "tox==4.67.2",
  "pre-commit==4.7.0",
  "black==26.10.1",

  # plus include the groups above if you like (or repeat explicitly)
  "ruff==0.17.3",
  "pylint==4.1.3",
  "mypy==2.4.0",
  "pyright[nodejs]==1.1.414",

  "build==1.6.1",
  "twine==7.0.0",
]




[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]



[tool.setuptools.package-data]
parsley = [
  "data/**/*.yaml",
  "py.typed",
]



[project.urls]
"Homepage" = "https://github.com/victorgabillon/parsley"






[tool.black]
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''



[tool.ruff]
line-length = 88
target-version = "py314"

# Enable import sorting (alphabetical + group order)
lint.select = ["I", "F", "E", "B", "TC","UP","SIM", "RUF","RET","N","A","D",
"ANN", "PERF", "TRY","LOG","RSE","ICN","TID","Q","W",
"ISC","PIE","ERA","TD"]  # I = imports, F = pyflakes, E = pycodestyle, TCH = type-checking, B = black

# Allow auto-fixing for imports and type-checking imports
lint.fixable = ["I", "TC", "F401","UP","SIM","RET","RUF","ERA","D","TRY","B","E"]

# Ignore rules you don't care about
lint.ignore = [ "E501","PLR0913","ANN401","TD003","TD002",
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

# Optional: add your first-party package to extend the known group
[tool.ruff.lint.per-file-ignores]
# If needed, can add file-specific ignores


# Keep public function annotation namespaces available to runtime consumers.
[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "collections.abc", "logging", "pathlib", "argparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=parsley"




[tool.pylint]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 88

#[tool.pylint.messages_control]
disable = [
    "C0301",
    "unnecessary-ellipsis",
    "W0511","R0913","R0917","R0903","R0914","R0912","R0915","R0911"
    ]


[tool.pylint.typecheck]
# Optional: same as init-hook in .pylintrc
init-hook = "import sys; sys.path.append('.')"

[tool.pylint.design]
min-public-methods = 1


#################### TOX ####################

[tool.tox]
min_version = "4.67.2"
env_list = ["py314", "lint", "typecheck", "build"]
isolated_build = true

[tool.tox.env_run_base]
base_python = ["python3.14"]

[tool.tox.env.py314]
description = "Run tests"
extras = ["test"]
commands = [["pytest", "{posargs}"]]

[tool.tox.env.lint]
description = "ruff + pylint (fast, no package install)"
package = "skip"
deps = [
  
  "PyYAML>=6.0.3",
  "dacite>=1.9.2",
  "click>=8.5.0",
  "rich>=15.0.0",

"ruff==0.17.3", "pylint==4.1.3"]
set_env = { PYTHONPATH = "{toxinidir}/src" }
commands = [
  ["python", "-m", "ruff", "check", "src"],
  ["python", "-m", "ruff", "format", "--check", "src", "tests"],
  ["python", "-m", "pylint", "src/parsley"],
]

[tool.tox.env.typecheck]
description = "mypy + pyright (fast, no package install)"
package = "skip"
deps = [
  "PyYAML>=6.0.3",
  "dacite>=1.9.2",
  "click>=8.5.0",
  "rich>=15.0.0",
   "types-PyYAML==6.0.12.20260906",
"mypy==2.4.0", "pyright[nodejs]==1.1.414"]
set_env = { MYPYPATH = "{toxinidir}/src" }
commands = [
  ["python", "-m", "mypy", "--config-file", "pyproject.toml", "src/parsley"],
  ["python", "-m", "pyright", "src/parsley"],
]

[tool.tox.env.build]
deps = ["build==1.6.1"]
commands = [["python", "-m", "build"]]

#################### END TOX ####################

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pyright]
pythonVersion = "3.14"
